<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Concurso de memes</title>
<link rel="stylesheet" href="../comun/comun.css?v=3">
<style>
.centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:40px}
.kick{font-weight:600;font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:var(--amarillo)}
h1{font-weight:700;font-size:150px;line-height:.95;text-transform:uppercase;color:var(--blanco);margin-top:14px}
.linea-roja{width:620px;margin-top:26px}
.reloj{font-weight:700;font-size:230px;line-height:1;color:var(--blanco);margin-top:26px;font-variant-numeric:tabular-nums;min-height:230px;display:flex;align-items:center}
.reloj.urgente{color:var(--rojo);animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{0%,100%{transform:scale(1);text-shadow:0 0 0 rgba(214,40,40,0)}50%{transform:scale(1.04);text-shadow:0 0 40px rgba(214,40,40,.55)}}
.comienza{font-weight:700;font-size:150px;line-height:1;color:var(--amarillo);text-transform:uppercase;
  animation:aparece .9s cubic-bezier(.16,1,.3,1) both}
@keyframes aparece{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.caja{margin-top:40px;padding:22px 40px}
.caja p{font-size:36px;line-height:1.3}
.caja .link{display:inline-block;margin-top:10px;font-weight:700;font-size:46px;color:var(--blanco);letter-spacing:.02em}
.caja .link span{color:var(--rojo)}
.premio{margin-top:26px;font-weight:600;font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:var(--amarillo)}
</style></head>
<body>
<div class="fondo-hud"></div>
<div class="centro">
  <div class="kick anim" id="kick">Hoy · 21:00 hora de Chile</div>
  <h1 class="anim anim-1">Concurso de <span class="rojo">memes</span></h1>
  <div class="linea-roja anim anim-2"></div>
  <div class="reloj num anim anim-2" id="reloj">--:--</div>
  <div class="caja hud anim anim-3">
    <p>Sube tu meme en el Discord antes de que llegue a cero</p>
    <div class="link"><span>discord.gg/</span>JR3a4ratT</div>
  </div>
  <div class="premio anim anim-4">Premio: Águilas de Oro</div>
</div>
<script>
// Hora objetivo: 21:00 en Chile (America/Santiago), sin depender de la zona horaria del PC.
// Se puede cambiar desde el link: ?fecha=2026-11-07&hora=21:00  ·  ?transparente=1 quita el fondo.
const params = new URLSearchParams(location.search);
if (params.get('transparente') === '1') {
  document.body.classList.add('transparente');
  document.querySelector('.fondo-hud').remove();
}
if (params.has('captura')) {
  document.documentElement.insertAdjacentHTML('beforeend',
    '<style>.anim,.comienza{animation-duration:0s!important;animation-delay:0s!important}</style>');
}

const ZONA = 'America/Santiago';
const formato = new Intl.DateTimeFormat('en-US', {
  timeZone: ZONA, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', second: '2-digit'
});
function horaEnChile(ms) {
  const p = {};
  for (const x of formato.formatToParts(new Date(ms))) p[x.type] = +x.value;
  return Date.UTC(p.year, p.month - 1, p.day, p.hour % 24, p.minute, p.second);
}
// Instante (ms) en que en Chile es año-mes-día hora:min. Se corrige dos veces por si cae cerca de un cambio de horario.
function instanteChile(a, m, d, h, mi) {
  const deseado = Date.UTC(a, m - 1, d, h, mi);
  let t = deseado;
  for (let i = 0; i < 2; i++) t += deseado - horaEnChile(t);
  return t;
}

const [a, m, d] = (params.get('fecha') || '2026-11-07').split('-').map(Number);
const [h, mi] = (params.get('hora') || '21:00').split(':').map(Number);
// ?prueba=SEGUNDOS: solo para probar, la cuenta termina en esa cantidad de segundos
const objetivo = params.has('prueba') ? Date.now() + Number(params.get('prueba')) * 1000 : instanteChile(a, m, d, h, mi);
document.getElementById('kick').textContent = `Hoy · ${String(h).padStart(2, '0')}:${String(mi).padStart(2, '0')} hora de Chile`;

const dos = (n) => String(n).padStart(2, '0');
const reloj = document.getElementById('reloj');
let terminado = false, ultimo = '';

function tick() {
  if (terminado) return;
  const falta = Math.ceil((objetivo - Date.now()) / 1000); // segundos que faltan, redondeado hacia arriba
  if (falta <= 0) {
    terminado = true;
    reloj.classList.remove('urgente');
    reloj.innerHTML = '<div class="comienza">¡Comienza el concurso!</div>';
    return;
  }
  const hh = Math.floor(falta / 3600), mm = Math.floor((falta % 3600) / 60), ss = falta % 60;
  const texto = hh > 0 ? `${hh}:${dos(mm)}:${dos(ss)}` : `${dos(mm)}:${dos(ss)}`;
  if (texto !== ultimo) { reloj.textContent = texto; ultimo = texto; }
  reloj.classList.toggle('urgente', falta <= 300);
}
tick();
setTimeout(() => { tick(); setInterval(tick, 250); }, 1000 - (Date.now() % 1000));
</script>
</body></html>
