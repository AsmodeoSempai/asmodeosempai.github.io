<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Torneo Alas de Acero</title>
<script>(function(p){var c=[];if(p.get("tema")==="halloween")c.push("halloween");if(p.get("formato")==="tiktok")c.push("tiktok");document.documentElement.className=c.join(" ")})(new URLSearchParams(location.search))</script>
<link rel="stylesheet" href="../comun/comun.css?v=3">
<style>
.diapo{position:absolute;inset:0;padding:110px 140px 150px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;transform:translateX(60px);pointer-events:none;transition:opacity .45s var(--sale),transform .45s var(--sale)}
.diapo.antes{transform:translateX(-60px)}
.diapo.activa{opacity:1;transform:none;transition:opacity .8s var(--entra) .25s,transform .8s var(--entra) .25s}
.kick{font-weight:600;font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--amarillo)}
.grande{font-weight:700;font-size:150px;line-height:.92;text-transform:uppercase;color:var(--blanco);margin-top:14px}
.titulo{font-weight:700;font-size:84px;line-height:1;text-transform:uppercase;color:var(--blanco);margin-top:12px}
.texto{font-size:34px;line-height:1.35;max-width:1250px;margin-top:26px}
.texto b,.lista b{color:var(--blanco);font-weight:700}
.linea-roja{width:600px;margin-top:28px;background:linear-gradient(90deg,var(--rojo),transparent)}
.etiqueta.grande-et{font-size:28px;padding:8px 18px;margin-top:26px}
.chips{display:flex;gap:18px;margin-top:40px;flex-wrap:wrap}
.chip{padding:18px 24px;min-width:280px}
.chip .v{font-weight:700;font-size:40px;color:var(--blanco);margin-top:4px}
.lista{list-style:none;margin-top:34px;display:grid;gap:14px;font-size:31px;line-height:1.3;max-width:1150px}
.lista li{display:flex;gap:18px;align-items:baseline}
.lista li:before{content:"";flex:none;width:12px;height:12px;background:var(--rojo);transform:translateY(-4px) rotate(45deg)}
.cols{display:grid;grid-template-columns:1fr auto;gap:70px;align-items:center}
.tel{height:720px;aspect-ratio:780/1688;border-radius:30px;border:2px solid var(--linea);overflow:hidden;background:#0d0e0b;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tel img{display:block;width:100%;height:100%;object-fit:cover}
.tels{display:flex;gap:44px;justify-content:center;margin-top:30px}
.tels figure{display:flex;flex-direction:column;align-items:center;gap:16px}
.tels .tel{height:610px}
.tels figcaption{font-weight:700;font-size:28px;text-transform:uppercase;color:var(--blanco);text-align:center}
.tels figcaption span{display:block;font-size:18px;letter-spacing:.18em;color:var(--rojo)}
.divs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.div{padding:22px 24px 20px}
.div .barra-color{height:4px;margin:-22px -24px 18px}
.div .n{font-weight:700;font-size:38px;text-transform:uppercase;color:var(--blanco);line-height:1}
.div .t{font-weight:600;font-size:24px;color:var(--tenue);margin-top:4px}
.div .br{font-weight:700;font-size:44px;color:var(--amarillo);margin-top:14px}
.div .d{font-size:22px;margin-top:6px}
.qr-grande{width:380px;height:380px;padding:16px}
.cta{font-weight:700;font-size:34px;text-transform:uppercase;color:var(--blanco);text-align:center;margin-top:18px}
.tabla{margin-top:30px;width:100%;max-width:1150px;border-collapse:collapse;font-size:30px}
.tabla td{padding:14px 18px;border-bottom:1px solid var(--linea)}
.tabla td:first-child{font-weight:700;color:var(--rojo);white-space:nowrap;width:1%}
.tabla td:last-child{color:var(--blanco)}
.tabla .v{color:var(--amarillo);font-weight:700}
.cartas{display:grid;gap:20px;margin-top:40px}
.cartas.c3{grid-template-columns:repeat(3,1fr)}
.carta{padding:24px 26px}
.carta .ic{font-weight:700;font-size:54px;line-height:1;color:var(--rojo);margin-bottom:8px}
.carta .p{font-weight:700;font-size:34px;color:var(--blanco);text-transform:uppercase;line-height:1.05}
.carta .d{font-size:25px;line-height:1.3;margin-top:10px}
.carta .d b{color:var(--blanco)}
.hud.mala{border-color:rgba(214,40,40,.6);background:rgba(214,40,40,.10)}
.aviso{margin-top:30px;padding:18px 24px;font-size:28px;max-width:1500px}
.aviso b{color:var(--blanco)}
.amarillo{color:var(--amarillo) !important}
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px}
.paso{padding:24px 26px}
.paso .num{position:absolute;right:20px;top:4px;font-weight:700;font-size:110px;line-height:1;color:rgba(214,40,40,.2)}
.paso .p{font-weight:700;font-size:36px;color:var(--blanco);text-transform:uppercase;line-height:1.05;position:relative}
.paso .d{font-size:25px;line-height:1.3;margin-top:12px;position:relative}
.flujo{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:14px;align-items:stretch;margin-top:40px}
.flujo .flecha{align-self:center}
.flujo .flecha{font-weight:700;font-size:70px;color:var(--rojo)}
.chip .v{white-space:nowrap}
.marcadores{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:40px}
.marcador{padding:20px 18px;text-align:center}
.marcador .m{font-weight:700;font-size:56px;color:var(--blanco);line-height:1.1;margin:6px 0 10px}
.marcador .gp{display:flex;justify-content:space-around;font-weight:700;font-size:36px;color:var(--amarillo)}
.marcador .gp span:last-child{color:var(--texto)}
.marcador .gp small{display:block;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.escalera{display:flex;flex-direction:column;gap:16px;min-width:640px;margin-top:30px}
.titulo + .cols{margin-top:34px}
.nivel{padding:18px 24px}
.nivel .n{font-weight:700;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue)}
.nivel .p{font-weight:700;font-size:38px;color:var(--blanco);text-transform:uppercase;line-height:1.05;margin-top:4px}
.nivel .d{font-size:23px;line-height:1.3;margin-top:6px}
.carta.anuncio{text-align:center}
.carta .cuantos{font-weight:700;font-size:110px;line-height:1;color:var(--amarillo)}
.llave{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;min-width:640px;position:relative}
.cruce{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;font-weight:700;font-size:44px;color:var(--blanco)}
.cruce i{font-style:normal;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--rojo)}
.ramas{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-weight:700;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue)}
.ramas div:not(:last-child):after{content:" ›";color:var(--rojo)}
.ramas .final{color:var(--amarillo)}
.pie{position:absolute;left:140px;right:140px;bottom:60px;display:flex;align-items:center;gap:24px}
.pie .k{font-size:18px}
.pie .casillas{width:620px}
.pie .casillas span{height:5px}
.pie .casillas span.on{background:var(--rojo)}
</style></head>
<body>
<div class="fondo-hud"></div>
<div id="diapos"></div>
<div class="pie"><span class="k num" id="contador">01 / 20</span><div class="casillas" id="puntos"></div><span class="k" style="margin-left:auto">Alas de Acero · Temporada 1 · Inscripciones abiertas</span></div>
<script src="../comun/comun.js?v=3"></script>
<script>
const tel = (n) => `<div class="tel"><img src="../comun/img/inscripcion-${n}.png" alt=""></div>`;
const qr = (clase = '') => `<div class="qr ${clase}"><img src="../comun/qr-play.svg" alt="Código QR de War League Planner"></div>`;

// 20 diapositivas: se mueven con los mismos botones de diapositivas del panel (comparten el número con la intro)
const DIAPOS = [
  // 1 — Portada
  () => `<div class="cols"><div>
      <div class="kick">War League Planner · Temporada 1</div>
      <div class="grande">Alas de<br><span class="rojo">Acero</span></div>
      <span class="etiqueta grande-et">Inscripciones abiertas</span>
      <div class="texto">Liga <b>1v1 de aviones</b>: una partida por semana, y el <b>top 8</b> de cada división juega los playoffs en vivo.</div>
    </div><div>${qr('qr-grande hud')}<div class="cta">Descarga gratis en Google Play</div></div></div>`,

  // 2 — Qué es
  () => `<div class="kick">¿Qué es?</div>
    <div class="titulo">Una liga <span class="rojo">larga</span> de aviones</div>
    <div class="chips">
      <div class="chip hud"><div class="k">Formato</div><div class="v">1 contra 1</div></div>
      <div class="chip hud"><div class="k">Cada semana</div><div class="v">1 partida</div></div>
      <div class="chip hud"><div class="k">Temporada</div><div class="v">12 operaciones</div></div>
      <div class="chip hud"><div class="k">Al final</div><div class="v">Top 8 a playoffs</div></div>
    </div>
    <ul class="lista">
      <li><span>Cada semana te toca un rival con un <b>puntaje parecido</b> al tuyo.</span></li>
      <li><span>Dura unos <b>3 meses</b> y <b>no hay límite</b> de jugadores.</span></li>
      <li><span>Te inscribes antes de que empiece o <b>hasta la operación 4</b>.</span></li>
      <li><span>Para ir a playoffs tienes que jugar al menos <b>8 operaciones</b>.</span></li>
    </ul>`,

  // 3 — Divisiones
  () => `<div class="kick">Divisiones</div>
    <div class="titulo">Tres divisiones <span class="rojo">por BR</span></div>
    <div class="divs">
      <div class="div hud"><div class="barra-color" style="background:#B87333"></div><div class="n">Alas de Bronce</div><div class="t">Hélices</div><div class="br">BR 1.0–6.3</div><div class="d">Cañón y maniobra, sin jets</div></div>
      <div class="div hud"><div class="barra-color" style="background:#C0C4C8"></div><div class="n">Alas de Plata</div><div class="t">Jets clásicos</div><div class="br">BR 6.7–10.3</div><div class="d">Jets sin misiles BVR</div></div>
      <div class="div hud"><div class="barra-color" style="background:#FFB703"></div><div class="n">Alas de Oro</div><div class="t">Top tier</div><div class="br">BR 10.7+</div><div class="d">Misiles modernos y Fox-3</div></div>
    </div>
    <ul class="lista">
      <li><span>El metal es el <b>BR</b>, no el nivel: Oro no es «mejor» que Bronce.</span></li>
      <li><span>Puedes jugar en <b>2 divisiones</b> como máximo, con la misma cuenta.</span></li>
      <li><span>Vale el BR que tenía el avión <b>al inicio de la temporada</b>.</span></li>
    </ul>`,

  // 4 — Cómo despega una división
  () => `<div class="cols"><div>
      <div class="kick">El despegue</div>
      <div class="titulo">Cada división parte con <span class="rojo">30 pilotos</span></div>
      <ul class="lista">
        <li><span>La app muestra <b>cuántos faltan</b> en cada división.</span></li>
        <li><span>Cada división es independiente: la que se llena primero, <b>parte primero</b>.</span></li>
        <li><span>Al llegar a 30, el organizador fija el <b>lunes de la Operación 1</b>.</span></li>
        <li><span>¿Quieres que parta antes? Toca <b>«Invitar a un piloto»</b>.</span></li>
      </ul>
    </div>${tel(7)}</div>`,

  // 5 — Inscribirse, pasos 1 y 2
  () => `<div class="kick">Cómo inscribirte · 1 de 2</div>
    <div class="titulo">Entra y crea <span class="rojo">tu cuenta</span></div>
    <div class="tels">
      <figure>${tel(1)}<figcaption><span>Paso 1</span>Entra a la división y elige desde dónde juegas</figcaption></figure>
      <figure>${tel(3)}<figcaption><span>Paso 2</span>Tu nombre de War Thunder, exacto</figcaption></figure>
    </div>`,

  // 6 — Inscribirse, pasos 3 a 5
  () => `<div class="kick">Cómo inscribirte · 2 de 2</div>
    <div class="titulo">Foto, guardar e <span class="rojo">inscribirte</span></div>
    <div class="tels">
      <figure>${tel(4)}<figcaption><span>Paso 3</span>Foto de tu perfil</figcaption></figure>
      <figure>${tel(5)}<figcaption><span>Paso 4</span>Guarda tu cuenta</figcaption></figure>
      <figure>${tel(6)}<figcaption><span>Paso 5</span>Toca «Inscribirme»</figcaption></figure>
    </div>`,

  // 7 — iPhone / BlueStacks
  () => `<div class="cols"><div>
      <div class="kick">¿No tienes Android?</div>
      <div class="titulo">Juega desde el PC con <span class="rojo">BlueStacks</span></div>
      <ul class="lista">
        <li><span>La app está en <b>Google Play</b>. Si usas iPhone, úsala en tu computador con <b>BlueStacks</b>, que es gratis.</span></li>
        <li><span>Al inscribirte eliges <b>«Computador con BlueStacks»</b>.</span></li>
        <li><span>En vez de fotos subes <b>capturas de pantalla</b>: tu rival las ve marcadas como «Captura de PC».</span></li>
        <li><span>La app para iPhone llegará <b>prontamente</b> al App Store.</span></li>
      </ul>
    </div>${tel(2)}</div>`,

  // 8 — La semana
  () => `<div class="kick">Cómo es una semana</div>
    <div class="titulo">Tu semana en <span class="rojo">Alas de Acero</span></div>
    <table class="tabla">
      <tr><td>Lunes y martes</td><td>Registras tu <b>horario</b> y tus <b>aviones</b>.</td></tr>
      <tr><td>Martes 23:59</td><td>Se publican tu <b>rival</b> y la <b>hora</b> de tu partida.</td></tr>
      <tr><td>Viernes 12:00</td><td>Se muestran el <b>mapa</b> y los <b>aviones</b> de los dos.</td></tr>
      <tr><td>Viernes 18:00 a domingo</td><td><span class="v">Se juega.</span> Check-in, rondas y fotos desde la app.</td></tr>
      <tr><td>Lunes 23:59</td><td>Último plazo para <b>confirmar o disputar</b> el resultado.</td></tr>
    </table>
    <div class="texto" style="font-size:26px">Horas de Chile continental: la app te las muestra en tu propia hora.</div>`,

  // 9 — Tu rival y la hora
  () => `<div class="kick">Reglas · tu partida</div>
    <div class="titulo">Tu rival y <span class="rojo">la hora</span></div>
    <div class="cartas c3">
      <div class="carta hud"><div class="ic">≈</div><div class="p">Puntaje parecido</div><div class="d">Te toca alguien cerca tuyo en la tabla y con quien no hayas jugado.</div></div>
      <div class="carta hud"><div class="ic">21:00</div><div class="p">Primera hora en común</div><div class="d">Si sus horarios no coinciden, se juega el <b>sábado a las 21:00</b>.</div></div>
      <div class="carta hud"><div class="ic">↔</div><div class="p">Pedir otra hora</div><div class="d">De miércoles a viernes 12:00. Tu rival elige dentro de tus rangos.</div></div>
    </div>
    <div class="aviso hud"><b>¿Número impar?</b> A uno le toca <b class="amarillo">permiso: 3 puntos</b>, por turnos.</div>`,

  // 10 — El día de la partida: check-in
  () => `<div class="kick">Reglas · el día de la partida</div>
    <div class="titulo">Antes de <span class="rojo">empezar</span></div>
    <div class="pasos">
      <div class="paso hud"><div class="num">1</div><div class="p">Check-in</div><div class="d">Desde 15 minutos antes: «Estoy listo» y foto del lobby con los dos nombres.</div></div>
      <div class="paso hud"><div class="num">2</div><div class="p">Sala privada</div><div class="d">La app genera la contraseña. Solo la ven ustedes dos.</div></div>
      <div class="paso hud"><div class="num">3</div><div class="p">¿No llega?</div><div class="d">«Mi rival no aparece»: tiene 15 minutos más. Si no, puedes ganar por W.O.</div></div>
    </div>
    <div class="aviso hud">Activa la <b>grabación de repeticiones</b> en War Thunder: te sirve de prueba si hay una disputa.</div>`,

  // 11 — En cada ronda
  () => `<div class="kick">Reglas · en cada ronda</div>
    <div class="titulo">Las reglas de <span class="rojo">la ronda</span></div>
    <div class="cartas c3">
      <div class="carta hud"><div class="p">Eliges en la app</div><div class="d">Los dos aviones se revelan al mismo tiempo y no se cambian.</div></div>
      <div class="carta hud mala"><div class="p">Otro avión = pierdes</div><div class="d">Si en el juego usas uno distinto al que elegiste.</div></div>
      <div class="carta hud"><div class="p">El que gana descansa</div><div class="d">Un avión que ganó una ronda no se repite en esa partida.</div></div>
      <div class="carta hud"><div class="p">Lados alternados</div><div class="d">Cada ronda los jugadores cambian de lado.</div></div>
      <div class="carta hud"><div class="p">Desconexión</div><div class="d">Se repite solo en los primeros 2 minutos y sin daño. Si no, pierde quien se fue.</div></div>
      <div class="carta hud"><div class="p">¿Empate?</div><div class="d">Gana quien tenga más puntaje de batalla.</div></div>
    </div>`,

  // 12 — Reportar y plazos
  () => `<div class="kick">Reglas · resultados</div>
    <div class="titulo">Reporta y <span class="rojo">confirma</span></div>
    <div class="flujo">
      <div class="paso hud"><div class="num">1</div><div class="p">Foto de la pantalla final</div><div class="d">Apenas termina cada ronda, con los dos nombres a la vista.</div></div>
      <div class="flecha">›</div>
      <div class="paso hud"><div class="num">2</div><div class="p">Tu rival confirma o disputa</div><div class="d">Para disputar hace falta una prueba: foto o repetición.</div></div>
      <div class="flecha">›</div>
      <div class="paso hud"><div class="num">3</div><div class="p">Plazo: lunes 23:59</div><div class="d">Si no respondes, queda su resultado.</div></div>
    </div>
    <div class="chips">
      <div class="chip hud mala"><div class="k">Sin responder</div><div class="v">−3 y una falta</div></div>
      <div class="chip hud mala"><div class="k">Nadie reporta</div><div class="v">−3 para los dos</div></div>
      <div class="chip hud"><div class="k">Disputas sin riesgo</div><div class="v">3 por temporada</div></div>
    </div>`,

  // 13 — Puntos
  () => `<div class="kick">Reglas · puntos</div>
    <div class="titulo">Perder parejo <span class="rojo">también suma</span></div>
    <div class="marcadores">
      ${[['Al mejor de 1', '1-0', 3, 1], ['Al mejor de 3', '2-0', 4, 1], ['Al mejor de 3', '2-1', 3, 2], ['Al mejor de 5', '3-0 o 3-1', 4, 1], ['Al mejor de 5', '3-2', 3, 2]]
        .map(([f, m, g, p]) => `<div class="marcador hud"><div class="k">${f}</div><div class="m">${m}</div>
          <div class="gp"><span><small>Gana</small>+${g}</span><span><small>Pierde</small>+${p}</span></div></div>`).join('')}
    </div>
    <div class="chips">
      <div class="chip hud"><div class="k">W.O. a favor</div><div class="v">+3</div></div>
      <div class="chip hud mala"><div class="k">W.O. en contra</div><div class="v">−3 y una falta</div></div>
      <div class="chip hud"><div class="k">Permiso</div><div class="v">+3</div></div>
    </div>`,

  // 14 — Faltas
  () => `<div class="kick">Reglas · faltas</div>
    <div class="titulo">Cuidado con <span class="rojo">las faltas</span></div>
    <div class="cols"><div>
      <div class="k" style="font-size:20px">Suman una falta</div>
      <ul class="lista">
        <li><span>No registrarte a tiempo.</span></li>
        <li><span>Perder por <b>W.O.</b></span></li>
        <li><span>No confirmar ni disputar el resultado.</span></li>
        <li><span>Rechazar un desafío sin rechazos gratis.</span></li>
        <li><span>No presentarte a un desafío.</span></li>
      </ul>
    </div><div class="escalera">
      <div class="nivel hud"><div class="n">2 seguidas</div><div class="p">Inactivo</div><div class="d">Quedas fuera hasta hablar con el organizador. Al volver, −5 por semana inactiva.</div></div>
      <div class="nivel hud mala"><div class="n">4 en la temporada</div><div class="p">Suspendido</div><div class="d">Puedes «Pedir volver» y el organizador decide.</div></div>
    </div></div>`,

  // 15 — Desafíos: cómo funcionan
  () => `<div class="kick">Reglas · desafíos</div>
    <div class="titulo">Desafía a los de <span class="rojo">arriba</span></div>
    <div class="cartas c3">
      <div class="carta hud"><div class="ic">2</div><div class="p">Desde la operación 2</div><div class="d">Aparte de tu partida semanal. Desafiar es opcional, <b>responder es obligatorio</b>.</div></div>
      <div class="carta hud"><div class="ic">¼</div><div class="p">Hasta ¼ de la tabla</div><div class="d">Entre 2 y 10 puestos más arriba. Con 20 jugadores, si vas 12.º: del 7.º al 11.º.</div></div>
      <div class="carta hud"><div class="ic">1+1</div><div class="p">1 enviado y 1 recibido</div><div class="d">Por semana. Con la misma persona, máximo 2 por temporada.</div></div>
    </div>
    <table class="tabla">
      <tr><td>Martes 00:00 a miércoles 12:00</td><td>Envías tu desafío. El miércoles a las 12:00 se asigna el mejor ubicado.</td></tr>
      <tr><td>24 horas</td><td>Para responder desde la asignación. No responder es rechazar.</td></tr>
    </table>`,

  // 16 — Desafíos: puntos y rechazos
  () => `<div class="kick">Reglas · desafíos</div>
    <div class="titulo">Puntos y <span class="rojo">rechazos</span></div>
    <div class="cols"><div>
      <table class="tabla">

let estado = null, actual = -1;
$('#diapos').innerHTML = DIAPOS.map((_, i) => `<section class="diapo" data-i="${i}"></section>`).join('');
$('#puntos').innerHTML = DIAPOS.map(() => '<span></span>').join('');
function rellenar(i) {
  const s = document.querySelector(`.diapo[data-i="${i}"]`);
  if (!s.dataset.lista) { s.innerHTML = DIAPOS[i](estado); s.dataset.lista = '1'; }
}
function mostrar(i) {
  rellenar(i);
  document.querySelectorAll('.diapo').forEach((s, j) => { s.classList.toggle('activa', j === i); s.classList.toggle('antes', j < i); });
  document.querySelectorAll('#puntos span').forEach((p, j) => p.classList.toggle('on', j <= i));
  poner('#contador', `${String(i + 1).padStart(2, '0')} / ${String(DIAPOS.length).padStart(2, '0')}`, 'textContent');
  actual = i;
}
conectar((nuevo) => {
  estado = nuevo;
  const i = Math.min(DIAPOS.length - 1, Math.max(0, nuevo.diapo | 0));
  if (i !== actual) mostrar(i);
});
</script>
