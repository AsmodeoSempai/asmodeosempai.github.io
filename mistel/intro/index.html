<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Intro</title>
<link rel="stylesheet" href="../comun/comun.css">
<style>
.diapo{position:absolute;inset:0;padding:120px 140px 150px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;transform:translateX(60px);pointer-events:none;transition:opacity .45s var(--sale),transform .45s var(--sale)}
.diapo.antes{transform:translateX(-60px)}
.diapo.activa{opacity:1;transform:none;transition:opacity .8s var(--entra) .25s,transform .8s var(--entra) .25s}
.kick{font-weight:600;font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--amarillo)}
.grande{font-weight:700;font-size:150px;line-height:.92;text-transform:uppercase;color:var(--blanco);margin-top:14px}
.titulo{font-weight:700;font-size:96px;line-height:1;text-transform:uppercase;color:var(--blanco);margin-top:12px}
.texto{font-size:36px;line-height:1.35;max-width:1250px;margin-top:28px}
.texto b{color:var(--blanco);font-weight:700}
.linea-roja{width:600px;margin-top:30px;background:linear-gradient(90deg,var(--rojo),transparent)}
.chips{display:flex;gap:20px;margin-top:44px;flex-wrap:wrap}
.chip{padding:18px 26px;min-width:300px}
.chip .v{font-weight:700;font-size:44px;color:var(--blanco);margin-top:4px}
.portada-img{position:absolute;right:0;top:0;height:100%;width:55%;object-fit:cover;opacity:.55;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.tabla{margin-top:36px;width:1300px;border-collapse:collapse;font-size:32px}
.tabla td{padding:13px 18px;border-bottom:1px solid var(--linea)}
.tabla td:first-child{font-weight:700;color:var(--rojo);width:150px}
.tabla td:last-child{color:var(--amarillo);font-weight:600;text-align:right}
.tabla tr.actual td{background:rgba(214,40,40,.12)}
.premios{display:grid;gap:22px;margin-top:44px}
.premio{padding:26px 24px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end}
.premio img{max-width:100%;max-height:110px;object-fit:contain;margin-bottom:auto;position:relative}
.premio .fondo-n{position:absolute;right:18px;top:0;font-weight:700;font-size:170px;line-height:1;color:rgba(255,255,255,.05)}
.premio.estrella .fondo-n{color:rgba(255,183,3,.10)}
.premio .n{font-weight:700;font-size:22px;letter-spacing:.16em;color:var(--rojo);text-transform:uppercase}
.premio .p{font-weight:700;font-size:40px;color:var(--blanco);text-transform:uppercase;line-height:1.05;margin-top:6px}
.premio.estrella{border-color:var(--amarillo)}
.premio.estrella .p{color:var(--amarillo)}
.estados{display:flex;gap:16px;margin-top:44px}
.estado{flex:1;padding:22px 16px;text-align:center}
.estado .n{font-weight:700;font-size:56px;color:var(--blanco)}
.estado .s{font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;color:var(--tenue)}
.estado.hecha .s{color:var(--amarillo)}
.estado.actual{border-color:var(--rojo)}
.estado.actual .s{color:var(--rojo)}
.alas{display:flex;gap:70px;align-items:center}
.alas .qr{width:330px;height:330px;padding:14px}
.pie{position:absolute;left:140px;right:140px;bottom:60px;display:flex;align-items:center;gap:24px}
.pie .k{font-size:18px}
.pie .casillas{width:420px}
.pie .casillas span{height:5px}
.pie .casillas span.on{background:var(--rojo)}
</style></head>
<body>
<div class="fondo-hud"></div>
<div id="diapos"></div>
<div class="pie"><span class="k num" id="contador">01 / 09</span><div class="casillas" id="puntos"></div><span class="k" style="margin-left:auto">Sueños Hechos Realidad · Mistel 2</span></div>
<script src="../comun/comun.js"></script>
<script>
const premioCaja = (n, estrella) => `<div class="premio hud ${estrella ? 'estrella' : ''}"><div class="fondo-n">${n}</div>${imgOpcional('premio-' + n + '.png')}
  <div class="n">Etapa ${n}</div><div class="p">${EVENTO.premios[n - 1]}</div></div>`;

// Las 9 diapositivas. Las que dependen del progreso se vuelven a dibujar con cada cambio.
const DIAPOS = [
  () => `${imgOpcional('portada.jpg', 'portada-img')}
    <div class="kick">Evento de War Thunder</div>
    <div class="grande">Sueños<br>Hechos<br><span class="rojo">Realidad</span></div>
    <div class="linea-roja"></div>
    <div class="texto">Premio mayor: el <b>Mistel 2</b> · 28 oct – 11 nov 2026</div>`,

  () => `<div class="kick">¿De qué se trata?</div>
    <div class="titulo">14 días · <span class="rojo">7 etapas</span></div>
    <div class="texto">En cada etapa juntas <b>35.000 puntos de misión</b> jugando partidas. Cada etapa completada entrega un premio, y en la <b>etapa 6</b> está el <span class="amarillo">Mistel 2</span>.</div>`,

  () => `<div class="kick">Las reglas</div>
    <div class="titulo">Una etapa cada <span class="rojo">2 días</span></div>
    <div class="chips">
      <div class="chip hud"><div class="k">Meta por etapa</div><div class="v">35.000 pts</div></div>
      <div class="chip hud"><div class="k">Cambio de etapa</div><div class="v">08:00 Chile</div></div>
      <div class="chip hud"><div class="k">En hora GMT</div><div class="v">11:00 GMT</div></div>
    </div>
    <div class="texto">Cuando se abre una etapa nueva, el contador de puntos parte de cero.</div>`,

  (estado, ev) => `<div class="kick">Calendario</div>
    <div class="titulo">Las 7 etapas</div>
    <table class="tabla">${[1, 2, 3, 4, 5, 6, 7].map((n) => `<tr class="${ev.fase === 'durante' && n === ev.etapa ? 'actual' : ''}">
      <td>Etapa ${n}</td><td>Desde el ${fmtFechaCorta(EVENTO.inicioEtapa(n))} · ${fmtHora(EVENTO.inicioEtapa(n))}</td><td>${EVENTO.premios[n - 1]}</td></tr>`).join('')}</table>`,

  () => `<div class="kick">Premios · parte 1</div>
    <div class="titulo">Etapas 1 a 4</div>
    <div class="premios" style="grid-template-columns:repeat(4,1fr)">${[1, 2, 3, 4].map((n) => premioCaja(n)).join('')}</div>`,

  () => `<div class="kick">Premios · parte 2</div>
    <div class="titulo">Etapas 5 a 7</div>
    <div class="premios" style="grid-template-columns:repeat(3,1fr)">${premioCaja(5)}${premioCaja(6, true)}${premioCaja(7)}</div>
    <div class="texto">El <b>Mistel 2</b>: un Ju 88 sin piloto cargado de explosivos, guiado por un Fw 190 montado encima.</div>`,

  (estado, ev) => `<div class="kick">Dónde vamos</div>
    <div class="titulo">${etapasHechas(estado)} de 7 <span class="rojo">etapas hechas</span></div>
    <div class="estados">${[1, 2, 3, 4, 5, 6, 7].map((n) => {
      const h = etapaHecha(estado, n), a = ev.fase === 'durante' && n === ev.etapa;
      const s = h ? 'Hecha ✓' : a ? fmtPuntos(puntosDe(estado, n)) + ' pts' : n < ev.etapa && ev.fase !== 'antes' ? 'Pendiente' : 'Por abrir';
      return `<div class="estado hud ${h ? 'hecha' : ''} ${a ? 'actual' : ''}"><div class="n">${n}</div><div class="s">${s}</div></div>`;
    }).join('')}</div>`,

  () => `<div class="alas">
      <div class="qr"><img src="../comun/qr-play.svg" alt=""></div>
      <div><div class="kick">También en este canal</div>
      <div class="titulo">Alas de <span class="rojo">Acero</span></div>
      <div class="texto">Liga 1v1 de aviones en <b>War League Planner</b>. Una partida por semana, 3 meses, y el <b>top 8</b> va a playoffs transmitidos en stream. Escanea el QR para inscribirte.</div></div>
    </div>`,

  (estado, ev) => `<div class="kick">Stream de hoy</div>
    <div class="grande">¡A <span class="rojo">volar</span>!</div>
    <div class="linea-roja"></div>
    <div class="texto">${ev.fase === 'durante'
      ? `Día <b>${ev.dia}</b> de 14 · Etapa <b>${ev.etapa}</b>: ${fmtPuntos(puntosDe(estado, ev.etapa))} de 35.000 puntos · cambia en <b class="num">${fmtDuracion(ev.restante)}</b>`
      : ev.fase === 'antes' ? 'El evento parte el 28 de octubre a las 08:00.' : 'El evento terminó. ¡Gracias por acompañarme!'}</div>`
];

let estado = null, actual = -1;
function construir() {
  poner('#diapos', DIAPOS.map((_, i) => `<section class="diapo" data-i="${i}"></section>`).join(''), 'innerHTML');
  poner('#puntos', DIAPOS.map(() => '<span></span>').join(''), 'innerHTML');
}
function rellenar(i) {
  const ev = calcularEvento();
  const s = document.querySelector(`.diapo[data-i="${i}"]`);
  const html = DIAPOS[i](estado, ev);
  if (s.dataset.html !== html) { s.innerHTML = html; s.dataset.html = html; }
}
function mostrar(i) {
  rellenar(i);
  document.querySelectorAll('.diapo').forEach((s, j) => {
    s.classList.toggle('activa', j === i);
    s.classList.toggle('antes', j < i);
  });
  document.querySelectorAll('#puntos span').forEach((p, j) => p.classList.toggle('on', j <= i));
  poner('#contador', `${String(i + 1).padStart(2, '0')} / ${String(DIAPOS.length).padStart(2, '0')}`, 'textContent');
  actual = i;
}
construir();
conectar((nuevo) => {
  estado = nuevo;
  const i = Math.min(DIAPOS.length - 1, Math.max(0, nuevo.diapo | 0));
  if (i !== actual) mostrar(i); else rellenar(i);
});
// Refresca las diapositivas con reloj (la 9 tiene cuenta regresiva)
setInterval(() => { if (estado && actual >= 0) rellenar(actual); }, 1000);
</script>
</body></html>
