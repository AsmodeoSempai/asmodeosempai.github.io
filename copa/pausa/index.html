<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Copa · Pausa</title>
<link rel="stylesheet" href="../comun/copa.css?v=1">
<style>
.centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:260px}
.centro .k{font-size:22px}
h1{font-weight:700;font-size:150px;text-transform:uppercase;color:var(--blanco);line-height:1;margin-top:12px}
.radar{position:relative;width:560px;height:3px;background:rgba(255,255,255,.1);margin-top:34px;overflow:hidden}
.radar i{position:absolute;top:0;bottom:0;width:140px;background:linear-gradient(90deg,transparent,var(--rojo),transparent);animation:barrer 2.6s cubic-bezier(.65,0,.35,1) infinite alternate}
@keyframes barrer{from{left:-140px}to{left:560px}}
.promo{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:1380px;display:flex;align-items:center;gap:34px;padding:22px 30px}
.promo .cuerpo{flex:1}
.promo h2{font-weight:700;font-size:44px;text-transform:uppercase;color:var(--blanco);line-height:1;margin-top:8px}
.promo h2 span{color:var(--rojo)}
.promo p{font-size:24px;margin-top:8px;line-height:1.3}
.promo p b{color:var(--amarillo)}
.promo .qr{width:150px;height:150px}
.promo .qrs figcaption{font-size:15px}
.promo .qrs figcaption span{display:none}
.promo.cerrada .qrs{display:none}
</style></head>
<body>
<div class="fondo-hud"></div><div class="fondo-img"></div>
<div class="centro">
  <div class="k anim">Pausa táctica</div>
  <h1 class="anim anim-1">Vuelvo <span class="rojo">enseguida</span></h1>
  <div class="radar anim anim-2"><i></i></div>
</div>
<div class="promo hud anim anim-4" id="promo">
  <div class="cuerpo">
    <span class="etiqueta" id="p-et">Mientras esperas</span>
    <h2>Copa Dupla de Acero <span>T3</span></h2>
    <p id="p-txt"></p>
  </div>
  <div class="qrs" id="p-qrs"></div>
</div>
<script src="../comun/copa.js?v=1"></script>
<script>
$('#p-qrs').innerHTML = QR_DISCORD + QR_APP;
fondoOpcional('fondo.jpg');
let estado = null;
function pintar() {
  if (!estado) return;
  const c = estado.config, t = calcularTorneo(estado), abierta = t.insc === 'abiertas';
  $('#promo').classList.toggle('cerrada', !abierta);
  poner('#p-et', abierta ? (t.ultimos ? `Mientras esperas · últimos ${t.libres} cupos` : 'Mientras esperas · inscríbete') : 'Mientras esperas', 'textContent');
  poner('#p-txt', abierta
    ? `2 vs 2 de tanques + aviones · sáb 28 y dom 29 de noviembre, <b>${esc(c.horaSab)}</b> (Chile)<br>Premio: <b>1.000 Águilas Doradas</b> para cada campeón · escanea e inscríbete`
    : `2 vs 2 de tanques + aviones · sáb 28 y dom 29 de noviembre, <b>${esc(c.horaSab)}</b> (Chile)<br>Premio: <b>1.000 Águilas Doradas</b> para cada campeón`);
}
conectar((n) => { estado = n; pintar(); });
cadaSegundo(pintar);
</script>
</body></html>
