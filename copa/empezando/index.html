<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Copa · Empezando</title>
<link rel="stylesheet" href="../comun/copa.css?v=1">
<style>
.centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:230px}
.centro .k{font-size:22px}
h1{font-weight:700;font-size:120px;text-transform:uppercase;color:var(--blanco);letter-spacing:.02em;line-height:1;margin-top:10px}
.centro .linea-roja{width:520px;margin-top:22px}
.reloj{font-weight:700;font-size:200px;color:var(--blanco);line-height:1;margin-top:26px}
.reloj.cero{color:var(--amarillo)}
.promo{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:1500px;display:flex;align-items:center;gap:34px;padding:22px 30px}
.promo .cuerpo{flex:1}
.promo h2{font-weight:700;font-size:46px;text-transform:uppercase;color:var(--blanco);line-height:1;margin-top:8px}
.promo h2 span{color:var(--rojo)}
.promo p{font-size:24px;margin-top:8px}
.promo p b{color:var(--amarillo)}
.promo .qr{width:150px;height:150px}
.promo .qrs figcaption{font-size:15px}
.promo .qrs figcaption span{display:none}
.promo.cerrada .qrs{display:none}
</style></head>
<body>
<div class="fondo-hud"></div><div class="fondo-img"></div>
<div class="centro">
  <div class="k anim"><span class="pulso"></span>War Thunder · en vivo</div>
  <h1 class="anim anim-1" id="titulo">El stream <span class="rojo">empieza</span> en</h1>
  <div class="linea-roja anim anim-2"></div>
  <div class="reloj num anim anim-2" id="reloj">--:--</div>
</div>
<div class="promo hud anim anim-4" id="promo">
  <div class="cuerpo">
    <span class="etiqueta" id="p-et">Inscripciones abiertas</span>
    <h2 id="p-h2">Copa Dupla de Acero <span>T3</span></h2>
    <p id="p-txt"></p>
  </div>
  <div class="qrs" id="p-qrs"></div>
</div>
<script src="../comun/copa.js?v=2"></script>
<script>
$('#p-qrs').innerHTML = QR_DISCORD + QR_APP;
fondoOpcional('fondo.jpg');
let estado = null, objetivo = null, cuentaN = null, usaPanel = false;
const carga = Date.now();

function pintar() {
  if (!estado) return;
  const c = estado.config, t = calcularTorneo(estado);
  if (!usaPanel) objetivo = carga + c.empezandoMin * 60000;
  const falta = objetivo - Date.now(), r = $('#reloj');
  if (falta > 0) {
    r.textContent = fmtReloj(falta, false); r.classList.remove('cero');
    poner('#titulo', 'El stream <span class="rojo">empieza</span> en');
  } else {
    r.textContent = '¡Ya!'; r.classList.add('cero');
    poner('#titulo', 'Estamos <span class="rojo">por partir</span>');
  }
  const abierta = t.insc === 'abiertas';
  $('#promo').classList.toggle('cerrada', !abierta);
  const et = $('#p-et');
  et.className = 'etiqueta' + (abierta && !t.ultimos ? '' : ' amarilla');
  poner(et, t.enVivo ? 'Hoy, en vivo' : abierta ? (t.ultimos ? `Inscripciones abiertas · últimos ${t.libres} cupos` : 'Inscripciones abiertas')
    : t.fase === 'terminado' ? 'Gracias por participar' : 'Inscripciones cerradas', 'textContent');
  poner('#p-txt', abierta
    ? `Torneo 2 vs 2 de tanques + aviones · sáb 28 y dom 29 de noviembre, <b>${esc(c.horaSab)}</b> (Chile) · premio: <b>1.000 Águilas Doradas</b> para cada campeón`
    : `Torneo 2 vs 2 de tanques + aviones · sáb 28 y dom 29 de noviembre, <b>${esc(c.horaSab)}</b> (Chile) · ¡síguelo en vivo aquí!`);
}

conectar((nuevo) => {
  // Si al abrir ya hay una cuenta lanzada desde el panel y sigue corriendo, se usa esa.
  if (cuentaN === null && nuevo.cuenta.fin > Date.now()) { usaPanel = true; objetivo = nuevo.cuenta.fin; }
  // "Reiniciar cuenta" desde el panel mientras la escena está abierta
  if (cuentaN !== null && nuevo.cuenta.n > cuentaN) { usaPanel = true; objetivo = nuevo.cuenta.fin; }
  cuentaN = nuevo.cuenta.n;
  estado = nuevo;
  pintar();
});
cadaSegundo(pintar);
</script>
</body></html>
